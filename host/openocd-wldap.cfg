# WLDAP OpenOCD 配置（CMSIS-DAP over TCP）

把 `cmsis-dap tcp host` 改成 ESP32-C5 的 IP。端口默认 4441。

```tcl
adapter driver cmsis-dap
cmsis-dap backend tcp

# ESP32-C5 WLDAP 的 IP
cmsis-dap tcp host 192.168.1.123
cmsis-dap tcp port 4441

# WiFi 抖动较大时降低超时误报
cmsis-dap tcp min_timeout 300

# 第一阶段只做 SWD
transport select swd
adapter speed 1000
```

使用时再加载目标 MCU 的 cfg，例如 STM32F1：

```bash
openocd -f host/openocd-wldap.cfg -f target/stm32f1x.cfg
```

或：

```bash
openocd -f host/openocd-wldap.cfg \
  -c "program firmware.elf verify reset exit" \
  -f target/stm32f1x.cfg
```

注意：

- `adapter speed` 先从 1000kHz 开始，稳定后再往上调。
- `cmsis_dap_tcp` 固件的 SWCLK 上限约 6MHz，不是 40MHz。
- 如果 OpenOCD 报 `command mismatch`，把 `min_timeout` 调到 300~500ms，并检查 WiFi RTT。
