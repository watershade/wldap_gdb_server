# WLDAP host-side OpenOCD configuration: CMSIS-DAP over TCP.
#
# Usage (override the IP *before* loading this file):
#   openocd -c "set WLDAP_IP 192.168.1.42" \
#           -f host/openocd-wldap.cfg -f target/stm32f1x.cfg
#
# If WLDAP_IP is not set, the default below is used.

if { ![info exists WLDAP_IP] } {
    set WLDAP_IP 192.168.1.123
}
if { ![info exists WLDAP_PORT] } {
    set WLDAP_PORT 4441
}

adapter driver cmsis-dap
cmsis-dap backend tcp
cmsis-dap tcp host $WLDAP_IP
cmsis-dap tcp port $WLDAP_PORT

# WiFi jitter is much larger than USB; a short timeout produces spurious
# "command mismatch" errors. Raise further (up to ~500) on a busy 2.4 GHz AP.
cmsis-dap tcp min_timeout 300

# Phase 1 is SWD only.
transport select swd

# Start conservatively; the firmware tops out around 6 MHz SWCLK anyway.
adapter speed 1000
